site_name: dhis2w
site_description: Python toolkit for DHIS2 (client, CLI, MCP server, browser automation).
site_url: https://winterop-com.github.io/dhis2w/
repo_url: https://github.com/winterop-com/dhis2w
repo_name: winterop-com/dhis2w
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Top-level tabs (Get started / Architecture / Client / CLI / MCP / FHIR /
    # Project) keep the surface-distinction visible up top
    # while each tab carries its own focused sidebar tree, so the Python API
    # surface (45 pages) gets its own home instead of dominating every page's
    # left rail.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy

nav:
  # One tab per feature surface - Client, CLI, MCP, FHIR. Client and CLI are
  # self-contained directories under docs/ holding their own guides, reference,
  # and design; MCP and FHIR are packs whose tabs point at their own sites.
  # "Get started" is onboarding only; "Architecture" is what the surfaces
  # share; "Project" carries the catalog, the roadmap, and everything
  # maintainer-facing.
  - Get started:
      - Home: index.md
      - Why dhis2w?: announcement.md
      - Install + local setup: local-setup.md
      - Connect to DHIS2: guides/connecting-to-dhis2.md
      - Walkthrough: walkthrough.md
      - How-to:
          - Visualizations: guides/visualizations.md
          - Playwright PAT helper: https://winterop-com.github.io/dhis2w-browser/pat-helper/
      - Examples index: examples.md
  - Architecture:
      - Overview: architecture/overview.md
      - Core:
          - Workspace layout: architecture/workspace.md
          - Naming conventions: architecture/conventions.md
          - Pluggable auth: architecture/auth.md
          - Profiles: architecture/profiles.md
          - Plugin runtime: architecture/plugins.md
          - External plugins: architecture/external-plugin.md
          - Browser automation: https://winterop-com.github.io/dhis2w-browser/
      - Per-version typing:
          - Typed schemas: architecture/typed-schemas.md
          - Version-aware clients: architecture/versioning.md
          - Schema diff (v41/v42/v43): architecture/schema-diff-v41-v42-v43.md
      - Plugins:
          - System module: architecture/system.md
          - Metadata CRUD: architecture/metadata-crud.md
          - Metadata plugin: architecture/metadata-plugin.md
          - Aggregate plugin: architecture/aggregate.md
          - Analytics plugin: architecture/analytics.md
          - Tracker plugin: architecture/tracker.md
          - Maintenance plugin: architecture/maintenance-plugin.md
          - User plugin: architecture/user-plugin.md
          - User groups + roles: architecture/user-groups-and-roles.md
          - Customize plugin: architecture/customize-plugin.md
          - Files plugin: architecture/files-plugin.md
          - Messaging plugin: architecture/messaging-plugin.md
          - Apps plugin: architecture/apps-plugin.md
          - Route plugin: architecture/route-plugin.md
          - Doctor plugin: architecture/doctor-plugin.md
          - FHIR plugin: https://winterop-com.github.io/dhis2w-fhir/architecture/
  - Client:
      - Introduction: client/index.md
      - Tutorial: client/tutorial.md
      - Architecture: architecture/client.md
      - Reference overview: api/index.md
      - Core:
          - Client + lifecycle: api/client.md
          - Profile + open_client: api/profile.md
          - Auth providers: api/auth.md
          - Retry policy: api/retry-policy.md
          - Errors: api/errors.md
          - Envelopes + responses: api/envelopes.md
          - Route auth schemes: api/auth-schemes.md
          - Sharing: api/sharing.md
          - Generated-model helpers: api/generated.md
          - OpenAPI-derived models: api/oas.md
      - Plugin accessors:
          - System module: api/system.md
          - Tracker reads: api/tracker.md
          - Aggregate: api/aggregate.md
          - Analytics: api/analytics.md
          - Maintenance: api/maintenance.md
          - Metadata accessor: api/metadata-accessor.md
          - Customize: api/customize.md
          - Files: api/files.md
          - Messaging: api/messaging.md
          - Routes (reverse proxy): api/routes.md
          - Data store: api/datastore.md
          - Apps: api/apps.md
          - Validation + predictors: api/validation.md
      - Metadata authoring:
          - Visualizations: api/visualizations.md
          - Maps: api/maps.md
          - Legend sets: api/legend-sets.md
          - Organisation units: api/organisation-units.md
          - Data elements: api/data-elements.md
          - Indicators: api/indicators.md
          - Program indicators: api/program-indicators.md
          - Data sets + sections: api/data-sets.md
          - Tracker schema: api/tracker-schema.md
          - Validation rules + predictors: api/validation-rules-predictors.md
          - SQL views: api/sql-views.md
          - Categories: api/categories.md
          - Category combos: api/category-combos.md
          - Category combo builder: api/category-combo-builder.md
          - Category option combos: api/category-option-combos.md
          - Category options: api/category-options.md
          - Attribute values: api/attribute-values.md
          - Option sets: api/option-sets.md
          - Program rules: api/program-rules.md
      - Streaming:
          - Data values (import + export): api/data-values.md
          - Analytics streaming: api/analytics-stream.md
      - Utilities:
          - JSON Patch ops: api/json-patch.md
          - Tasks module: api/tasks.md
          - Periods: api/periods.md
          - UIDs: api/uids.md
  - CLI:
      - Introduction: cli/index.md
      - Tutorial: cli/tutorial.md
      - Architecture: architecture/cli.md
      - Reference: cli-reference.md
  - MCP:
      - Overview: https://winterop-com.github.io/dhis2w-mcp/
      - Surfaces compared: https://winterop-com.github.io/dhis2w-mcp/architecture/mcp-surfaces/
      - Full server:
          - Tutorial: https://winterop-com.github.io/dhis2w-mcp/tutorial/
          - Architecture: https://winterop-com.github.io/dhis2w-mcp/architecture/mcp/
          - Tool reference: https://winterop-com.github.io/dhis2w-mcp/tool-reference/
      - Bridge:
          - Usage: https://winterop-com.github.io/dhis2w-mcp/bridge/
          - Design: https://winterop-com.github.io/dhis2w-mcp/architecture/mcp-bridge/
      - Router:
          - Design: https://winterop-com.github.io/dhis2w-mcp/architecture/mcp-router/
  - FHIR: https://winterop-com.github.io/dhis2w-fhir/
  - Project:
      - Overview: project/index.md
      - Feature catalog: project/features.md
      - Roadmap: roadmap.md
      - Upstream DHIS2 quirks: project/upstream-quirks.md
      - Decisions log: decisions.md
      - Lessons learned: lessons.md
      - Maintaining:
          - Codegen: codegen.md
          - Releasing to PyPI: releasing.md
          - Testing strategy: testing.md
          - Manual testing: manual-testing.md
          - Troubleshooting: troubleshooting.md
      - AI agent testing:
          - Overview: ai-agent-testing.md
          - Benchmark plan (1.0): notes/benchmark-plan.md
          - Benchmark results (latest): notes/benchmark-results.md
          - Model benchmarks:
              - General capability (axis 1): notes/general-benchmark.md
              - Bridge read + write (axis 2): notes/model-benchmark.md
          - Bridge design + verification:
              - Design log + rounds: notes/small-model-bridge.md
              - Command x model matrix: notes/cli-matrix.md
              - Bridge verification: notes/bridge-verification.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      # Lets docs pages embed repository-root files (BUGS.md, the planning
      # docs) via `--8<-- "FILE"` so the site renders them without a second
      # copy. base_path is the repo root (where mkdocs runs).
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

