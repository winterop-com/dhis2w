[project]
name = "dhis2w-plugin-hello"
version = "0.1.0"
description = "Minimal external plugin example — shows how to add a `d2w hello` command + MCP tool via entry-point registration."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dhis2w-client",
  "dhis2w-core",
  "typer>=0.15",
]

[project.entry-points."dhis2w.plugins.v1"]
# Each entry-point's value is an "import path:attribute" to the plugin object.
# dhis2w-core's pluginkit host loads this group, registers every object it finds under
# the entry-point name, and calls each object's `contribute(version_key)` extension.
# The contract version lives in the group name — dhis2w.plugins.v1, don't change it.
hello = "dhis2w_plugin_hello:plugin"

[build-system]
requires = ["uv_build>=0.5,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dhis2w_plugin_hello"
module-root = "src"
