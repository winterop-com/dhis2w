# The template's selection: which DHIS2 metadata this guide publishes. The tree under
# ig/input/ was generated from exactly these UIDs on the DHIS2 demo instance the project
# templates are cut from, so it already matches them. Point the project at an instance of
# your own and this is the first block to change - then run `d2w fhir generate` to rewrite
# ig/input/ from what that instance holds.

[generate.data_sets]
# EPI Stock: twelve data elements on the default category combination.
include_ids = ["TuL8IOPzpHh"]

[generate.event_programs]
# Malaria case registration: a program without registration, one stage, three questions.
include_ids = ["VBqh0ynB2wv"]

[generate.tracker_programs]
# Child Programme: the registration form and its two stage forms.
include_ids = ["IpHINAT79UW"]

[generate.option_sets]
# This table adds to the option sets the forms above bind their questions to, which are
# published whatever it says. An absent table, or an empty list, publishes every option
# set the instance holds.
include_ids = ["hiQ3QFheQ3O"]

[generate.categories]
# The DHIS2 built-in `default` category alone: this guide publishes the forms and no
# category axis. This table narrows - a non-empty list is the whole set published.
include_ids = ["GLevLNI9wkl"]

[generate.organisation_units]
# One district, down to the facilities the forms are assigned at. Every unit publishes
# an Organization and a Location, so this pair is the dial that bounds the compile.
root = "PMa2VCrupOd"
max_level = 4
