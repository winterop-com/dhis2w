[project]
name = "dhis2w-cli"
version = "1.25.0.dev0"
description = "d2w command-line interface (Typer) — mounts plugins from dhis2w-core."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "dhis2w-core>=1.24.2,<2.0",
  "typer>=0.27.1",
  "rich>=15",
  "dhis2w-fhir>=1.24.2,<2.0",
]

[project.optional-dependencies]
browser = ["dhis2w-browser>=1.24.2,<2.0"]
serve = [
    "dhis2w-fhir-serve>=1.24.2,<2.0",
]
security = [
    "dhis2w-security>=1.19.0,<2.0",
]

[project.scripts]
d2w = "dhis2w_cli.main:main"

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w"
Documentation = "https://winterop-com.github.io/dhis2w/"
Repository = "https://github.com/winterop-com/dhis2w"
Changelog = "https://github.com/winterop-com/dhis2w/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dhis2w-fhir = { workspace = true }
dhis2w-fhir-serve = { workspace = true }
